version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sentinel_db
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_pass
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_gateway_1
    environment:
      - DATABASE_URL=postgresql://sentinel_user:sentinel_pass@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ID=gateway-1
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  gateway-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_gateway_2
    environment:
      - DATABASE_URL=postgresql://sentinel_user:sentinel_pass@db:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - GATEWAY_ID=gateway-2
      - PORT=8000
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - gateway-1
    restart: always

volumes:
  postgres_data:
